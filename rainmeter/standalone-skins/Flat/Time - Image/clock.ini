[Rainmeter]
Update=1000
DynamicWindowSize=1

[Variables]
DigitWidth=15
DigitHeight=21
DigitRegex="^([0-9]{1})([0-9]{1})([0-9]{1})([0-9]{1})$"
DigitSpacing=-3
SeparatorSpacing=-6

[MeasureTime]
Measure=Time
Format=%H%M

[MeasureHourDec]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="#DigitRegex#":"\1"

[MeasureHourUnit]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="#DigitRegex#":"\2"

[MeasureMinuteDec]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="#DigitRegex#":"\3"

[MeasureMinuteUnit]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="#DigitRegex#":"\4"

[ImageBackground]
Meter=Image
ImageName=bg.png
W=57
H=#DigitHeight#
X=0
Y=0

[ImageHourDec]
Meter=Image
MeasureName=MeasureHourDec
W=#DigitWidth#
H=#DigitHeight#
X=0
Y=0

[ImageHourUnit]
Meter=Image
MeasureName=MeasureHourUnit
W=#DigitWidth#
H=#DigitHeight#
X=#DigitSpacing#R

[ImageHourSeparator]
Meter=Image
ImageName=separator.png
W=#DigitWidth#
H=#DigitHeight#
X=#SeparatorSpacing#R

[ImageMinuteDec]
Meter=Image
MeasureName=MeasureMinuteDec
W=#DigitWidth#
H=#DigitHeight#
X=#SeparatorSpacing#R

[ImageMinuteUnit]
Meter=Image
MeasureName=MeasureMinuteUnit
W=#DigitWidth#
H=#DigitHeight#
X=#DigitSpacing#R
