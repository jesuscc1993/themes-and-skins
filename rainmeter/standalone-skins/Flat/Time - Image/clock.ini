[Rainmeter]
Update=1000
DynamicWindowSize=1

[Variables]
NumberWidth=15
NumberHeight=21

[MeasureTime]
Measure=Time
Format=%H%M

[MeasureHourDec]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]{1})([0-9]{1})([0-9]{1})([0-9]{1})$":"\1"

[MeasureHourUnit]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]{1})([0-9]{1})([0-9]{1})([0-9]{1})$":"\2"

[MeasureMinuteDec]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]{1})([0-9]{1})([0-9]{1})([0-9]{1})$":"\3"

[MeasureMinuteUnit]
Measure=String
String=[MeasureTime]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^([0-9]{1})([0-9]{1})([0-9]{1})([0-9]{1})$":"\4"

[ImageBackground]
Meter=Image
ImageName=bg.png
W=57
H=#NumberHeight#
X=0
Y=0

[ImageHourDec]
Meter=Image
MeasureName=MeasureHourDec
W=#NumberWidth#
H=#NumberHeight#
X=0
Y=0

[ImageHourUnit]
Meter=Image
MeasureName=MeasureHourUnit
W=#NumberWidth#
H=#NumberHeight#
X=-3R
Y=0

[ImageHourSeparator]
Meter=Image
ImageName=separator.png
W=#NumberWidth#
H=#NumberHeight#
X=-6R
Y=0

[ImageMinuteDec]
Meter=Image
MeasureName=MeasureMinuteDec
W=#NumberWidth#
H=#NumberHeight#
X=-6R
Y=0

[ImageMinuteUnit]
Meter=Image
MeasureName=MeasureMinuteUnit
W=#NumberWidth#
H=#NumberHeight#
X=-3R
Y=0
